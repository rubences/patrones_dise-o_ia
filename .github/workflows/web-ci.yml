name: Editorial, Hardening, Publication and Web CI

on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'content/**'
      - 'book/**'
      - 'scripts/**'
      - 'src/pattern_*.ts'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'content/**'
      - 'book/**'
      - 'scripts/**'
      - 'src/pattern_*.ts'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate editorial catalog
        run: node scripts/validate-editorial.mjs

      - name: Build reproducible evidence pack
        run: node scripts/build-evidence-pack.mjs

      - name: Assemble canonical book manuscript
        run: node scripts/build-book.mjs

      - name: Verify publication artifacts
        run: |
          test -s dist/evidence/evidence-pack.json
          test -s dist/evidence/EVIDENCE_REPORT.md
          test -s dist/book/patrones-ia-manuscript.md
          test -s dist/book/manifest.json
          node -e "const m=require('./dist/book/manifest.json'); if(m.patternCount!==102||m.familyCount!==10) process.exit(1)"

      - name: Install root dependencies
        run: npm install

      - name: Run hardening regression tests
        run: npx --yes tsx@4.20.6 --test tests/hardening/*.test.ts

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build Astro site
        working-directory: web
        run: npm run build
