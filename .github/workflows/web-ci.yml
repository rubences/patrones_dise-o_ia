name: Editorial, Hardening, Publication and Web CI

on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'content/**'
      - 'book/**'
      - 'publications/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'README.md'
      - '*.md'
      - 'docs/**'
      - 'research/**'
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'content/**'
      - 'book/**'
      - 'publications/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'README.md'
      - '*.md'
      - 'docs/**'
      - 'research/**'
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  QUARTO_VERSION: '1.10.18'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Validate editorial catalog
        run: node scripts/validate-editorial.mjs

      - name: Validate complete catalog referential integrity
        run: node scripts/validate-catalog-integrity.mjs

      - name: Validate repository consistency
        run: node scripts/validate-repository-consistency.mjs

      - name: Validate web and 365-pattern publication coverage
        run: node scripts/validate-web-publication-coverage.mjs

      - name: Validate dual publication architecture
        run: node scripts/validate-publications.mjs

      - name: Validate submission readiness gates
        run: node scripts/validate-submission-readiness.mjs

      - name: Validate primary evidence registry
        run: node scripts/validate-evidence-registry.mjs

      - name: Build reproducible evidence pack
        run: node scripts/build-evidence-pack.mjs

      - name: Generate per-family quality and evidence report
        run: node scripts/report-pattern-quality.mjs

      - name: Validate generated per-family quality report
        run: node scripts/validate-pattern-quality-report.mjs

      - name: Assemble canonical reference manuscript
        run: node scripts/build-book.mjs

      - name: Render distributable reference edition
        run: quarto render dist/book/patrones-ia-manuscript.md

      - name: Build distribution manifest and release notes
        run: |
          node scripts/build-distribution-manifest.mjs
          node scripts/build-release-notes.mjs ci-${{ github.sha }}

      - name: Verify reference publication artifacts
        run: |
          test -s dist/evidence/evidence-pack.json
          test -s dist/evidence/EVIDENCE_REPORT.md
          test -s dist/book/patrones-ia-manuscript.md
          test -s dist/book/manifest.json
          test -s dist/book/patrones-ia-manuscript.html
          test -s dist/book/patrones-ia-manuscript.epub
          test -s dist/book/patrones-ia-manuscript.pdf
          test -s dist/book/distribution-manifest.json
          test -s dist/book/RELEASE_NOTES.md
          grep -q 'Corpus SHA-256' dist/book/RELEASE_NOTES.md
          grep -q 'Manuscrito SHA-256' dist/book/RELEASE_NOTES.md
          node -e "const b=require('./dist/book/manifest.json'),e=require('./dist/evidence/evidence-pack.json'),q=require('./catalog/evidence-baseline.json'); if(b.patternCount!==require('./catalog/taxonomy.json').catalogSize||b.familyCount!==require('./catalog/taxonomy.json').families.length||e.summary.patternsWithPrimaryEvidence<q.minimumPrimaryPatterns||b.primaryEvidenceChapters!==e.summary.patternsWithPrimaryEvidence||e.primaryRegistry.referenceCount<q.minimumPrimaryReferences) process.exit(1)"
          node -e "const m=require('./dist/book/distribution-manifest.json'); if(m.patternCount!==require('./catalog/taxonomy.json').catalogSize||m.familyCount!==require('./catalog/taxonomy.json').families.length||m.artifacts.length!==3) process.exit(1)"

      - name: Assemble publisher-specific submission packages
        run: node scripts/build-submission-packages.mjs

      - name: Render RA-MA evaluation package
        run: quarto render dist/submissions/ra-ma/ra-ma-evaluation-package.md --to typst

      - name: Verify publisher-specific submission packages and readiness report
        run: |
          test -s dist/submissions/manifest.json
          test -s dist/submissions/submission-readiness-report.json
          test -s dist/submissions/SUBMISSION_READINESS_REPORT.md
          test -s dist/submissions/springer-nature/springer-book-idea-master.md
          test -s dist/submissions/ra-ma/ra-ma-evaluation-package.md
          test -s dist/submissions/ra-ma/ra-ma-evaluation-package.pdf
          pdf_bytes=$(stat -c%s dist/submissions/ra-ma/ra-ma-evaluation-package.pdf)
          test "$pdf_bytes" -lt 31457280
          node -e "const m=require('./dist/submissions/manifest.json'); const r=m.packages.find(x=>x.publisher==='RA-MA'); const s=m.packages.find(x=>x.publisher==='Springer Nature'); if(m.schemaVersion!==2||!r||!s||r.sampleCount!==2||s.sampleCount!==2||r.maxPdfBytes!==31457280) process.exit(1)"
          node -e "const r=require('./dist/submissions/submission-readiness-report.json'); if(r.schemaVersion!==1||r.publicSafe!==true||r.policy!=='fail-closed'||r.publications.length!==2) process.exit(1)"
          echo "RA-MA PDF bytes: $pdf_bytes / 31457280"

      - name: Install root dependencies
        run: npm ci

      - name: Strict TypeScript typecheck for all 365 pattern modules
        run: npx tsc --noEmit --project tsconfig.json

      - name: Run hardening regression tests
        run: npx --yes tsx@4.20.6 --test tests/hardening/*.test.ts

      - name: Verify P8 interoperability contracts
        run: npx --yes tsx@4.20.6 tests/p8_interoperability_contracts.ts

      - name: Verify P9 experimental catalog and contract tests
        run: npx --yes tsx@4.20.6 tests/p9_catalog_contracts.ts

      - name: Test P9 differentiated memory patterns
        run: npx --yes tsx@4.20.6 --test tests/p9_memory_patterns.test.ts

      - name: Test P9 differentiated governance patterns
        run: npx --yes tsx@4.20.6 --test tests/p9_governance_patterns.test.ts

      - name: Test P9 differentiated data-quality patterns
        run: npx --yes tsx@4.20.6 --test tests/p9_data_quality_patterns.test.ts

      - name: Test P9 edge and resource-aware patterns
        run: npx --yes tsx@4.20.6 --test tests/p9_edge_patterns.test.ts

      - name: Test P9 causal and neuro-symbolic contracts
        run: npx --yes tsx@4.20.6 --test tests/p9_causal_patterns.test.ts

      - name: Test MCP and evidence hardening
        run: npx --yes tsx@4.20.6 --test tests/p9_security_hardening.test.ts

      - name: Test MCP policy and trusted registry hardening
        run: npx --yes tsx@4.20.6 --test tests/p9_mcp_policy_registry_hardening.test.ts

      - name: Test P13 decision control contracts
        run: npx --yes tsx@4.20.6 --test tests/p13_decision_control_patterns.test.ts

      - name: Test P14 evaluation integrity contracts
        run: npx --yes tsx@4.20.6 --test tests/p14_evaluation_integrity_patterns.test.ts

      - name: Test P15 bounded autonomy contracts
        run: npx --yes tsx@4.20.6 --test tests/p15_bounded_autonomy_patterns.test.ts

      - name: Test Interactive Lab graph model
        run: node --experimental-strip-types --test tests/interactive-lab-pattern-graph.test.mjs tests/interactive-lab-diagram-smoke.test.mjs

      - name: Validate macrofamily navigation
        run: node --test tests/macrofamilies-navigation.test.mjs

      - name: Test Interactive Lab architecture schema
        run: npx --yes tsx@4.20.6 --test tests/interactive-lab-architecture-schema.test.ts

      - name: Validate Archify diagram sources and integration
        run: node --test tests/archify-diagrams.test.mjs

      - name: Test local Interactive Lab project storage
        run: npx --yes tsx@4.20.6 --test tests/interactive-lab-local-projects.test.ts

      - name: Test Interactive Lab editor operations and interface
        run: |
          npx --yes tsx@4.20.6 --test tests/interactive-lab-editor-operations.test.ts
          node --test tests/interactive-lab-editor-smoke.test.mjs
          npx --yes tsx@4.20.6 --test tests/interactive-lab-editor-history.test.ts
          npx --yes tsx@4.20.6 --test tests/interactive-lab-edge-editing.test.ts
          node --test tests/interactive-lab-accessibility.test.mjs
          npx --yes tsx@4.20.6 --test tests/interactive-lab-project-management.test.ts
          npx --yes tsx@4.20.6 --test tests/interactive-lab-simulation.test.ts
          npx --yes tsx@4.20.6 --test tests/interactive-lab-structural-analysis.test.ts

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build Astro site
        working-directory: web
        run: npm run build

      - name: Checkout pinned Archify 3.2.0 renderer
        uses: actions/checkout@v7
        with:
          repository: tt-a1i/archify
          ref: 208acba8d412335185b2056fedf54b3405df43fb
          path: .tooling/archify
          persist-credentials: false

      - name: Generate and browser-validate Archify diagrams
        run: node scripts/build-archify-diagrams.mjs

      - name: Upload reference and submission publication bundle
        uses: actions/upload-artifact@v7
        with:
          name: patrones-ia-publication-${{ github.sha }}
          path: |
            dist/book/patrones-ia-manuscript.md
            dist/book/patrones-ia-manuscript.html
            dist/book/patrones-ia-manuscript.epub
            dist/book/patrones-ia-manuscript.pdf
            dist/book/manifest.json
            dist/book/distribution-manifest.json
            dist/book/RELEASE_NOTES.md
            dist/evidence/evidence-pack.json
            dist/evidence/EVIDENCE_REPORT.md
            dist/quality/pattern-quality.json
            dist/quality/PATTERN_QUALITY_REPORT.md
            dist/submissions/manifest.json
            dist/submissions/submission-readiness-report.json
            dist/submissions/SUBMISSION_READINESS_REPORT.md
            dist/submissions/springer-nature/springer-book-idea-master.md
            dist/submissions/ra-ma/ra-ma-evaluation-package.md
            dist/submissions/ra-ma/ra-ma-evaluation-package.pdf
          if-no-files-found: error
          retention-days: 30
