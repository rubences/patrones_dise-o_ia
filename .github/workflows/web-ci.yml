name: Editorial, Hardening, Publication and Web CI

on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'content/**'
      - 'book/**'
      - 'publications/**'
      - 'scripts/**'
      - 'src/pattern_*.ts'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - '.github/workflows/web-ci.yml'
      - '.github/workflows/release-book.yml'
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'content/**'
      - 'book/**'
      - 'publications/**'
      - 'scripts/**'
      - 'src/pattern_*.ts'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - '.github/workflows/web-ci.yml'
      - '.github/workflows/release-book.yml'
  workflow_dispatch:

env:
  QUARTO_VERSION: '1.10.18'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Validate editorial catalog
        run: node scripts/validate-editorial.mjs

      - name: Validate dual publication architecture
        run: node scripts/validate-publications.mjs

      - name: Validate submission readiness gates
        run: node scripts/validate-submission-readiness.mjs

      - name: Validate primary evidence registry
        run: node scripts/validate-evidence-registry.mjs

      - name: Build reproducible evidence pack
        run: node scripts/build-evidence-pack.mjs

      - name: Assemble canonical reference manuscript
        run: node scripts/build-book.mjs

      - name: Render distributable reference edition
        run: quarto render dist/book/patrones-ia-manuscript.md

      - name: Build distribution manifest and release notes
        run: |
          node scripts/build-distribution-manifest.mjs
          node scripts/build-release-notes.mjs ci-${{ github.sha }}

      - name: Verify reference publication artifacts
        run: |
          test -s dist/evidence/evidence-pack.json
          test -s dist/evidence/EVIDENCE_REPORT.md
          test -s dist/book/patrones-ia-manuscript.md
          test -s dist/book/manifest.json
          test -s dist/book/patrones-ia-manuscript.html
          test -s dist/book/patrones-ia-manuscript.epub
          test -s dist/book/patrones-ia-manuscript.pdf
          test -s dist/book/distribution-manifest.json
          test -s dist/book/RELEASE_NOTES.md
          grep -q 'Corpus SHA-256' dist/book/RELEASE_NOTES.md
          grep -q 'Manuscrito SHA-256' dist/book/RELEASE_NOTES.md
          node -e "const b=require('./dist/book/manifest.json'),e=require('./dist/evidence/evidence-pack.json'); if(b.patternCount!==102||b.familyCount!==10||e.summary.patternsWithPrimaryEvidence<10||b.primaryEvidenceChapters!==e.summary.patternsWithPrimaryEvidence||e.primaryRegistry.referenceCount<10) process.exit(1)"
          node -e "const m=require('./dist/book/distribution-manifest.json'); if(m.patternCount!==102||m.familyCount!==10||m.artifacts.length!==3) process.exit(1)"

      - name: Assemble publisher-specific submission packages
        run: node scripts/build-submission-packages.mjs

      - name: Render RA-MA evaluation package
        run: quarto render dist/submissions/ra-ma/ra-ma-evaluation-package.md --to typst

      - name: Verify publisher-specific submission packages and readiness report
        run: |
          test -s dist/submissions/manifest.json
          test -s dist/submissions/submission-readiness-report.json
          test -s dist/submissions/SUBMISSION_READINESS_REPORT.md
          test -s dist/submissions/springer-nature/springer-book-idea-master.md
          test -s dist/submissions/ra-ma/ra-ma-evaluation-package.md
          test -s dist/submissions/ra-ma/ra-ma-evaluation-package.pdf
          pdf_bytes=$(stat -c%s dist/submissions/ra-ma/ra-ma-evaluation-package.pdf)
          test "$pdf_bytes" -lt 31457280
          node -e "const m=require('./dist/submissions/manifest.json'); const r=m.packages.find(x=>x.publisher==='RA-MA'); const s=m.packages.find(x=>x.publisher==='Springer Nature'); if(m.schemaVersion!==2||!r||!s||r.sampleCount!==2||s.sampleCount!==2||r.maxPdfBytes!==31457280) process.exit(1)"
          node -e "const r=require('./dist/submissions/submission-readiness-report.json'); if(r.schemaVersion!==1||r.publicSafe!==true||r.policy!=='fail-closed'||r.publications.length!==2) process.exit(1)"
          echo "RA-MA PDF bytes: $pdf_bytes / 31457280"

      - name: Install root dependencies
        run: npm ci

      - name: Run hardening regression tests
        run: npx --yes tsx@4.20.6 --test tests/hardening/*.test.ts

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build Astro site
        working-directory: web
        run: npm run build

      - name: Upload reference and submission publication bundle
        uses: actions/upload-artifact@v7
        with:
          name: patrones-ia-publication-${{ github.sha }}
          path: |
            dist/book/patrones-ia-manuscript.md
            dist/book/patrones-ia-manuscript.html
            dist/book/patrones-ia-manuscript.epub
            dist/book/patrones-ia-manuscript.pdf
            dist/book/manifest.json
            dist/book/distribution-manifest.json
            dist/book/RELEASE_NOTES.md
            dist/evidence/evidence-pack.json
            dist/evidence/EVIDENCE_REPORT.md
            dist/submissions/manifest.json
            dist/submissions/submission-readiness-report.json
            dist/submissions/SUBMISSION_READINESS_REPORT.md
            dist/submissions/springer-nature/springer-book-idea-master.md
            dist/submissions/ra-ma/ra-ma-evaluation-package.md
            dist/submissions/ra-ma/ra-ma-evaluation-package.pdf
          if-no-files-found: error
          retention-days: 30
