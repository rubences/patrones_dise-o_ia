name: Editorial, Hardening and Web CI

on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'content/**'
      - 'scripts/validate-editorial.mjs'
      - 'src/pattern_*.ts'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'content/**'
      - 'scripts/validate-editorial.mjs'
      - 'src/pattern_*.ts'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate editorial catalog
        run: node scripts/validate-editorial.mjs

      - name: Install root dependencies
        run: npm install

      - name: Run hardening regression tests
        run: node --loader ts-node/esm --test tests/hardening/*.test.ts

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build Astro site
        working-directory: web
        run: npm run build
