name: Build Distributable Book Artifacts

on:
  pull_request:
    paths:
      - 'content/**'
      - 'catalog/**'
      - 'book/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'web/package.json'
      - '.github/workflows/book-artifacts.yml'
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'catalog/**'
      - 'book/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'web/package.json'
      - '.github/workflows/book-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  QUARTO_VERSION: '1.10.18'

jobs:
  render-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build canonical evidence and manuscript
        run: |
          node scripts/validate-editorial.mjs
          node scripts/validate-repository-consistency.mjs
          node scripts/validate-evidence-registry.mjs
          node scripts/build-evidence-pack.mjs
          node scripts/build-book.mjs

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Render HTML, EPUB and PDF
        run: |
          # Use the same multi-format manuscript render as the canonical publication
          # pipeline, then stage renamed copies for the downloadable bundle.
          quarto render dist/book/patrones-ia-manuscript.md

          mkdir -p dist/release
          cp dist/book/patrones-ia-manuscript.html dist/release/patrones-ia.html
          cp dist/book/patrones-ia-manuscript.epub dist/release/patrones-ia.epub
          cp dist/book/patrones-ia-manuscript.pdf dist/release/patrones-ia.pdf

          test -s dist/release/patrones-ia.html
          test -s dist/release/patrones-ia.epub
          test -s dist/release/patrones-ia.pdf

      - name: Verify binary release artifacts
        run: node scripts/verify-book-release.mjs

      - name: Upload distributable edition
        uses: actions/upload-artifact@v7
        with:
          name: patrones-ia-book-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/release/patrones-ia.html
            dist/release/patrones-ia.epub
            dist/release/patrones-ia.pdf
            dist/release/release-manifest.json
            dist/book/patrones-ia-manuscript.md
            dist/book/manifest.json
            dist/evidence/evidence-pack.json
            dist/evidence/EVIDENCE_REPORT.md
