name: Deploy Patrones IA Web

on:
  workflow_run:
    workflows:
      - 'Editorial, Hardening, Publication and Web CI'
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Build Astro site
        working-directory: web
        run: npm run build

      - name: Checkout pinned Archify 3.2.0 renderer
        uses: actions/checkout@v7
        with:
          repository: tt-a1i/archify
          ref: 208acba8d412335185b2056fedf54b3405df43fb
          path: .tooling/archify
          persist-credentials: false

      - name: Generate and browser-validate Archify diagrams
        run: node scripts/build-archify-diagrams.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
