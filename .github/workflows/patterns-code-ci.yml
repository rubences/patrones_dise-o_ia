name: Patterns TypeScript and Contract CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'research/p10/privacy/**'
      - 'research/p10/embodied/**'
      - 'research/p10/science/**'
      - 'research/p10/economics/**'
      - 'research/p11/formal/**'
      - 'research/p11/supply-chain/**'
      - 'research/p11/observability/**'
      - 'research/p11/synthetic/**'
      - 'research/p11/human-ai/**'
      - 'research/p11/knowledge/**'
      - 'research/p12/identity/**'
      - 'research/p12/context/**'
      - 'research/p12/inference/**'
      - 'research/p12/redteam/**'
      - 'research/p12/incident/**'
      - 'research/p12/data-contracts/**'
      - 'research/p12/deployment/**'
      - 'research/p12/accessibility/**'
      - 'catalog/**'
      - 'content/patterns/**'
      - 'scripts/validate-catalog-integrity.mjs'
      - 'scripts/report-pattern-quality.mjs'
      - 'scripts/validate-pattern-quality-report.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/patterns-code-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'research/p10/privacy/**'
      - 'research/p10/embodied/**'
      - 'research/p10/science/**'
      - 'research/p10/economics/**'
      - 'research/p11/formal/**'
      - 'research/p11/supply-chain/**'
      - 'research/p11/observability/**'
      - 'research/p11/synthetic/**'
      - 'research/p11/human-ai/**'
      - 'research/p11/knowledge/**'
      - 'research/p12/identity/**'
      - 'research/p12/context/**'
      - 'research/p12/inference/**'
      - 'research/p12/redteam/**'
      - 'research/p12/incident/**'
      - 'research/p12/data-contracts/**'
      - 'research/p12/deployment/**'
      - 'research/p12/accessibility/**'
      - 'catalog/**'
      - 'content/patterns/**'
      - 'scripts/validate-catalog-integrity.mjs'
      - 'scripts/report-pattern-quality.mjs'
      - 'scripts/validate-pattern-quality-report.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/patterns-code-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patterns-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-contracts:
    name: Typecheck and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate editorial catalog
        run: node scripts/validate-editorial.mjs
      - name: Validate referential integrity
        run: node scripts/validate-catalog-integrity.mjs
      - name: Typecheck all pattern modules
        run: npx tsc --noEmit --project tsconfig.json
      - name: Existing hardening regression suite
        run: npx --yes tsx@4.20.6 --test tests/hardening/*.test.ts
      - name: P8 interoperability contracts
        run: npx --yes tsx@4.20.6 tests/p8_interoperability_contracts.ts
      - name: P9 catalog contracts
        run: npx --yes tsx@4.20.6 tests/p9_catalog_contracts.ts
      - name: P9 and security regressions
        run: npx --yes tsx@4.20.6 --test tests/p9_*.test.ts
      - name: Strict typecheck for staged P10 privacy candidates
        run: npx tsc --noEmit --project research/p10/privacy/tsconfig.json
      - name: Test P10 staged privacy contracts
        run: npx --yes tsx@4.20.6 --test tests/p10_privacy_patterns.test.ts
      - name: Test P10 privacy integration workflow
        run: npx --yes tsx@4.20.6 --test tests/p10_privacy_integration.test.ts
      - name: Typecheck P10 embodied simulation candidates
        run: npx tsc --noEmit --project research/p10/embodied/tsconfig.json
      - name: Test P10 embodied simulation contracts
        run: npx --yes tsx@4.20.6 --test tests/p10_embodied_patterns.test.ts
      - name: Typecheck P10 scientific discovery candidates
        run: npx tsc --noEmit --project research/p10/science/tsconfig.json
      - name: Test P10 scientific discovery contracts
        run: npx --yes tsx@4.20.6 --test tests/p10_science_patterns.test.ts
      - name: Typecheck P10 economics candidates
        run: npx tsc --noEmit --project research/p10/economics/tsconfig.json
      - name: Test P10 economics contracts
        run: npx --yes tsx@4.20.6 --test tests/p10_economics_patterns.test.ts
      - name: Typecheck P11 formal runtime assurance research
        run: npx tsc --noEmit --project research/p11/formal/tsconfig.json
      - name: Test P11 formal runtime assurance contracts
        run: npx --yes tsx@4.20.6 --test tests/p11_formal_patterns.test.ts
      - name: Typecheck P11 supply-chain security research
        run: npx tsc --noEmit --project research/p11/supply-chain/tsconfig.json
      - name: Test P11 supply-chain contracts
        run: npx --yes tsx@4.20.6 --test tests/p11_supply_chain_patterns.test.ts
      - name: Typecheck P11 observability research
        run: npx tsc --noEmit --project research/p11/observability/tsconfig.json
      - name: Test P11 observability contracts
        run: npx --yes tsx@4.20.6 --test tests/p11_observability_patterns.test.ts
      - name: Typecheck P11 synthetic data research
        run: npx tsc --noEmit --project research/p11/synthetic/tsconfig.json
      - name: Test P11 synthetic data contracts
        run: npx --yes tsx@4.20.6 --test tests/p11_synthetic_patterns.test.ts
      - name: Typecheck P11 human-AI collaboration research
        run: npx tsc --noEmit --project research/p11/human-ai/tsconfig.json
      - name: Test P11 human-AI collaboration contracts
        run: npx --yes tsx@4.20.6 --test tests/p11_human_ai_patterns.test.ts
      - name: Typecheck P11 knowledge engineering research
        run: npx tsc --noEmit --project research/p11/knowledge/tsconfig.json
      - name: Test P11 knowledge engineering contracts
        run: npx --yes tsx@4.20.6 --test tests/p11_knowledge_patterns.test.ts
      - name: Typecheck P12 identity trust research
        run: npx tsc --noEmit --project research/p12/identity/tsconfig.json
      - name: Test P12 identity trust contracts
        run: npx --yes tsx@4.20.6 --test tests/p12_identity_patterns.test.ts
      - name: Typecheck P12 context engineering research
        run: npx tsc --noEmit --project research/p12/context/tsconfig.json
      - name: Test P12 context engineering contracts
        run: npx --yes tsx@4.20.6 --test tests/p12_context_patterns.test.ts
      - name: Typecheck P12 inference-time compute research
        run: npx tsc --noEmit --project research/p12/inference/tsconfig.json
      - name: Test P12 inference-time compute contracts
        run: npx --yes tsx@4.20.6 --test tests/p12_inference_patterns.test.ts
      - name: Typecheck P12 adversarial evaluation research
        run: npx tsc --noEmit --project research/p12/redteam/tsconfig.json
      - name: Test P12 adversarial evaluation contracts
        run: npx --yes tsx@4.20.6 --test tests/p12_redteam_patterns.test.ts
      - name: Typecheck P12 incident response research
        run: npx tsc --noEmit --project research/p12/incident/tsconfig.json
      - name: Test P12 incident response contracts
        run: npx --yes tsx@4.20.6 --test tests/p12_incident_patterns.test.ts
      - name: Typecheck P12 semantic data contracts research
        run: npx tsc --noEmit --project research/p12/data-contracts/tsconfig.json
      - name: Test P12 semantic data contracts
        run: npx --yes tsx@4.20.6 --test tests/p12_data_contracts_patterns.test.ts
      - name: Typecheck P12 deployment lifecycle research
        run: npx tsc --noEmit --project research/p12/deployment/tsconfig.json
      - name: Test P12 deployment lifecycle contracts
        run: npx --yes tsx@4.20.6 --test tests/p12_deployment_patterns.test.ts
      - name: Typecheck P12 accessibility research
        run: npx tsc --noEmit --project research/p12/accessibility/tsconfig.json
      - name: Test P12 accessibility contracts
        run: npx --yes tsx@4.20.6 --test tests/p12_accessibility_patterns.test.ts
      - name: Generate and validate quality report
        run: |
          node scripts/report-pattern-quality.mjs
          node scripts/validate-pattern-quality-report.mjs
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patterns-quality-${{ github.sha }}
          path: dist/quality/
          if-no-files-found: ignore
